<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acerte o Alvo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Acerte o Alvo</h1>

  <div class="painel">
    <div class="indicador"><span>Tempo</span><strong id="tempo">10</strong></div>
    <div class="indicador"><span>Pontos</span><strong id="pontos">0</strong></div>
  </div>

  <div id="container">
    <div id="msg">Clique em “Iniciar” e acerte o alvo o máximo de vezes em 10 segundos.</div>
    <div id="alvo"></div>
  </div>

  <button id="iniciar">Iniciar</button>

  <script src="script.js"></script>
</body>
</html>
